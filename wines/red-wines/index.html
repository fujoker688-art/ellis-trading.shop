<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Wines - Ellis Trading</title>
    <meta name="description" content="Shop our selection of premium red wines from Bordeaux and beyond.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">Ellis <span>Trading</span></a>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/wines/" class="active">Wines</a></li>
                    <li><a href="/about/">About</a></li>
                    <li><a href="/contact/">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="cart-icon">🛒<span class="cart-count">0</span></div>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <h1>Red Wines</h1>
        <p>Bold and complex selections from Bordeaux and beyond</p>
    </section>

    <section class="products">
        <div class="product-grid" id="productGrid"></div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-section">
                <h5>Ellis Trading</h5>
                <p>Your trusted source for premium wines and spirits.</p>
            </div>
            <div class="footer-section">
                <h5>Quick Links</h5>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/wines/">Our Wines</a></li>
                    <li><a href="/wines/red-wines/">Red Wines</a></li>
                    <li><a href="/wines/white-wines/">White Wines</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Ellis Trading. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const redWines = [
            { name: "LA CUVEE HENRI 2018", nameCn: "亨利特釀 2018", price: "HK$680", img: "/images/LA CUVEE HENRI 2018.jpg", badge: "Popular" },
            { name: "LA RÉSERVE DE ROSTÉGUY 2008", nameCn: "羅斯特傑紅葡萄酒 2008", price: "HK$960", img: "/images/LA RÉSERVE DE ROSTÉGUY 2008.jpg", badge: "" },
            { name: "LA RÉSERVE HENRI 2016", nameCn: "亨利酒窖珍藏 2016", price: "HK$960", img: "/images/LA RÉSERVE HENRI 2016.jpg", badge: "" },
            { name: "COUR DE MONTEGNAN 2017", nameCn: "蒙特尼昂庫爾紅葡萄酒 2017", price: "HK$550", img: "/images/COUR DE MONTEGNAN 2017.jpg", badge: "" },
            { name: "LE CLOS DE LA ROQUETTE 2019", nameCn: "羅凱特葡萄園紅葡萄酒 2019", price: "HK$500", img: "/images/LE CLOS DE LA ROQUETTE 2019.jpg", badge: "New" },
            { name: "LE CLOS DE LA ROQUETTE 2019 x 4 BOTTLES", nameCn: "羅凱特葡萄園紅葡萄酒 2019 四瓶特惠組", price: "HK$1,600", img: "/images/LE CLOS DE LA ROQUETTE 2019 x 4 BOTTLES.jpg", badge: "Value" },
            { name: "LE DONJON DE CELEYRAN 2019", nameCn: "賽列亨城堡紅葡萄酒 2019", price: "HK$650", img: "/images/LE DONJON DE CELEYRAN 2019.jpg", badge: "" },
            { name: "LE DONJON DE CELEYRAN 2019 x 4 BOTTLES", nameCn: "賽列亨城堡紅葡萄酒 2019 四瓶特惠組", price: "HK$2,080", img: "/images/LE DONJON DE CELEYRAN 2019 x 4 BOTTLES.jpg", badge: "Value" }
        ];

        function getSlug(name) {
                    return name.toLowerCase().replace(/ /g, "-").replace(/&/g, "and").replace(/'/g, "").replace(/[^a-z0-9-]/g, "").replace(/-+/g, "-").replace(/^-|-$/g, "");
                }
                document.getElementById('productGrid').innerHTML = redWines.map(p => `
                    <a href="/products/${getSlug(p.name)}/" class="product-card">
                        <div class="product-image">
                            <img src="${p.img}" alt="${p.name}" loading="lazy">
                            ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-category">Red Wine</div>
                            <h3 class="product-name">${p.name}</h3>
                            <div class="product-name-cn">${p.nameCn}</div>
                            <div class="product-price">${p.price}</div>
                        </div>
                    </a>
                `).join('');
    </script>
</body>
</html>
